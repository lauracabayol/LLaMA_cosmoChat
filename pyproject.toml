[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "chatCosmoHub" 
version = "0.1.0"
description = "LLM for astronomical data queries."  
requires-python = ">=3.9"
dependencies = [
    "fastapi",
    "jinja2",
    "pydantic",
    "python-multipart",  
    "pandas",
    "torch",
    "huggingface-hub",
    "transformers",
]

[tool.hatch.build.targets.wheel]
packages = ["https://github.com/lauracabayol/LLaMA_cosmoChat"] 